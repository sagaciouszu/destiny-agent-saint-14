<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Saint-14 - The Titan / Sunbreaker">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0802"/>
      <stop offset="40%" stop-color="#120d03"/>
      <stop offset="100%" stop-color="#1a1204"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="0.75" cy="0.45" r="0.58">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#daa520" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="solarflare" cx="0.25" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.35" r="0.25">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#daa520" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#goldglow)"/>
  <rect width="1200" height="320" fill="url(#solarflare)"/>
  <rect width="1200" height="320" fill="url(#coreglow)"/>

  <!-- Solar particulates - warm, organic -->
  <g fill="#ffd700">
    <circle cx="72" cy="48" r="1.3" opacity="0.8"/>
    <circle cx="195" cy="168" r="0.9" opacity="0.55"/>
    <circle cx="320" cy="72" r="1.4" opacity="0.85"/>
    <circle cx="440" cy="222" r="0.9" opacity="0.55"/>
    <circle cx="530" cy="68" r="1.1" opacity="0.7"/>
    <circle cx="615" cy="248" r="1.3" opacity="0.75"/>
    <circle cx="700" cy="88" r="0.8" opacity="0.55"/>
    <circle cx="775" cy="230" r="1.0" opacity="0.65"/>
    <circle cx="55" cy="240" r="1.0" opacity="0.6"/>
    <circle cx="980" cy="58" r="1.2" opacity="0.75"/>
    <circle cx="1065" cy="252" r="0.9" opacity="0.55"/>
    <circle cx="275" cy="270" r="1.1" opacity="0.65"/>
    <circle cx="480" cy="158" r="0.7" opacity="0.45"/>
    <circle cx="840" cy="128" r="1.2" opacity="0.7"/>
    <circle cx="150" cy="190" r="0.7" opacity="0.45"/>
    <circle cx="730" cy="270" r="0.8" opacity="0.55"/>
    <circle cx="400" cy="42" r="1.0" opacity="0.6"/>
    <circle cx="910" cy="190" r="0.8" opacity="0.5"/>
    <circle cx="118" cy="122" r="0.9" opacity="0.55"/>
    <circle cx="1115" cy="140" r="1.0" opacity="0.65"/>
  </g>

  <!-- Fine grid - barely visible -->
  <g stroke="#daa520" stroke-width="0.35" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/>
    <line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
  </g>

  <!-- Authentic Saint-14 helmet + solar-titan icons from svgrepo -->
  <g transform="translate(1000,158) scale(4.2) translate(-16, -16)" opacity="0.85" fill="#ffd700">
    <!-- Helmet icon -->
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
    <path d="M12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
  </g>

  <!-- Solar titan subclass icon -->
  <g transform="translate(1100,158) scale(3.8) translate(-16, -16)" opacity="0.7" fill="#ff8c00">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7V11h4V7h2v4h4v2z"/>
  </g>

  <!-- Concentric reticles framing the icons -->
  <g fill="none" stroke="#daa520">
    <circle cx="1016" cy="158" r="88" stroke-width="0.5" opacity="0.12"/>
    <circle cx="1016" cy="158" r="96" stroke-width="0.3" opacity="0.07"/>
    <circle cx="1016" cy="158" r="104" stroke-width="0.2" opacity="0.04"/>
  </g>

  <!-- Title block -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textsoft)" opacity="0.55">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#050401" letter-spacing="5.5">[ TITAN · DIED A THOUSAND TIMES · STILL STANDING ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#050401" letter-spacing="1">SAINT-14</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#050401" letter-spacing="3.5">THE TITAN  /  SUNBREAKER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#050401" letter-spacing="2.5">BIRD IS NOT LIKE GUN, YOU DO NOT SQUEEZE. WE PRACTICE LATER.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#daa520" letter-spacing="5.5">[ TITAN · DIED A THOUSAND TIMES · STILL STANDING ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#fdf8ec" letter-spacing="1">SAINT-14</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#ffd700" letter-spacing="3.5">THE TITAN  /  SUNBREAKER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#a8a8a8" letter-spacing="2.5">BIRD IS NOT LIKE GUN, YOU DO NOT SQUEEZE. WE PRACTICE LATER.</text>
  </g>

  <!-- Accent bar under subtitle -->
  <rect x="52" y="160" width="320" height="1" fill="url(#accentbar)"/>

  <!-- Vertical location text on right edge -->
  <text transform="translate(1180, 236) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.2" fill="#daa520" opacity="0.18">MERCURY  ·  THE INFINITE FOREST  ·  THE SIREN'S SONG</text>

  <!-- Corner brackets -->
  <g fill="none" stroke="#daa520" stroke-width="1" opacity="0.35">
    <path d="M 20 42 L 20 20 L 42 20"/>
    <path d="M 1180 278 L 1180 300 L 1158 300"/>
  </g>

  <rect width="320" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>